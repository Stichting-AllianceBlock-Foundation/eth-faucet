services:
  # Run the faucet
  faucet:
    build: .
    image: eth-faucet
    command:
      - -httpport=8180
      - -proxycount=1
      - -faucet.name=${CHAIN_NAME:-nexera}
      - -faucet.symbol=${CHAIN_SYMBOL:-tNXRA}
      - -wallet.provider=${NODE_ENDPOINT:-http://geth:8545}
      - -wallet.privkey=${FAUCET_PK}
      - -hcaptcha.sitekey=${HCAPTCHA_SITEKEY}
      - -hcaptcha.secret=${HCAPTCHA_SECRET}
    ports:
      - 8180:8180
